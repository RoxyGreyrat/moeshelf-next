[package]
name = "galgame-manager"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "galgame_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 目录/文件选择是自制的（src/components/common/PathPickerDialog.tsx）：
# 系统对话框的观感和这套界面差太远，所以不再引入 tauri-plugin-dialog。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }
# 补丁包解压：只用得着 deflate（国内补丁 zip 基本都是 deflate），
# 不要 deflate64/bzip2/zstd 那些，能少带一堆 C 依赖。
zip = { version = "2", default-features = false, features = ["deflate"] }
# 国内补丁包里的中文文件名常常是 GBK 且没打 UTF-8 标记，按 UTF-8 解会变乱码
encoding_rs = "0.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
